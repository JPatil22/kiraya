<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 10px; font-family: sans-serif; }
    input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    label { font-size: 12px; font-weight: bold; margin-bottom: 4px; display: block; }
    button { width: 100%; padding: 8px; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0051a8; }
  </style>
</head>
<body>
  <h3>Kiraya Settings</h3>
  <label>API Endpoint</label>
  <input type="text" id="apiEndpoint" placeholder="http://localhost:3000/api/ingest" />
  
  <label>API Key</label>
  <input type="password" id="apiKey" placeholder="Your secret key" />
  
  <button id="saveBtn">Save</button>
  <div id="status" style="margin-top: 10px; color: green; font-size: 12px; text-align: center;"></div>
  <script src="popup.js"></script>
</body>
</html>
